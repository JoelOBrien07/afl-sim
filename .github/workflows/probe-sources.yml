# This workflow only CHECKS which extra data sources GitHub can reach. It never changes the website.
# Run it by hand: Actions tab > "Probe data sources" > Run workflow. Read the report on the run's Summary page.
name: Probe data sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 1: simple web requests (Squiggle ladder, AFL Tables, Footywire).
      - name: Probe web sources
        run: node scripts/probe-sources.mjs
        env:
          SQUIGGLE_CONTACT: ${{ vars.SQUIGGLE_CONTACT }}

      # Step 2: the fitzRoy R package, which knows how to read Fryzigg, AFL.com.au and Footywire.
      # continue-on-error means a failure here still leaves step 1's report.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install fitzRoy
        run: Rscript -e 'install.packages("fitzRoy")'
      - name: Probe fitzRoy sources
        continue-on-error: true
        run: Rscript scripts/probe-fitzroy.R
