# This workflow rebuilds and publishes the website. It does these things:
#   1. Downloads fresh AFL data and weather (scripts/fetch-data.mjs).
#   2. Downloads player data and trains SirenSim v2 (scripts/fetch-players.R and scripts/build-v2.mjs).
#   3. Bundles the site/ folder, including the new data files.
#   4. Publishes it to GitHub Pages.
# It runs by itself on a schedule, whenever you push to main, or when you click "Run workflow".

name: Update data and deploy

on:
  # Run on a timer. The cron format is: minute hour day-of-month month day-of-week.
  # '0 */6 * * *' means minute 0 of every 6th hour. Change it to refresh more or less often.
  # Squiggle asks for sensible usage, so avoid going more often than every few hours.
  schedule:
    - cron: '0 */6 * * *'
  # Adds a "Run workflow" button on the Actions tab so you can trigger it by hand.
  workflow_dispatch:
  # Also run whenever code is pushed to the main branch, so your edits go live.
  push:
    branches: [main]

# What this workflow is allowed to do. It can read the repo and publish to Pages, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# If a new run starts while an older one is still going, cancel the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Tells GitHub this job publishes to the Pages environment and records the live URL.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Download this repository's files onto the build machine.
      - uses: actions/checkout@v4

      # Install Node.js (the data script needs it).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Work out the current year. It is part of the cache name below.
      - name: Work out the current year
        id: year
        run: echo "year=$(date +%Y)" >> "$GITHUB_OUTPUT"

      # Past seasons never change, so we download them once and keep a saved copy (history.json).
      # Squiggle asks people not to download the same data over and over, and this also keeps every run fast.
      # To force a fresh download, change v3 to v4 in the key below.
      - name: Restore saved past seasons
        uses: actions/cache@v4
        with:
          path: site/data/history.json
          key: history-v2-${{ steps.year.outputs.year }}

      # Download games, results, venues, weather and model tips, and write site/data/season.json
      # (and history.json if it was not restored from the cache).
      # SQUIGGLE_CONTACT comes from Settings > Secrets and variables > Actions > Variables.
      - name: Fetch data
        run: node scripts/fetch-data.mjs
        env:
          SQUIGGLE_CONTACT: ${{ vars.SQUIGGLE_CONTACT }}

      # ---- SirenSim v2 (player data model) ----
      # Everything in this block is allowed to fail without stopping the site from deploying (continue-on-error).
      # If it fails, the site simply has no v2 numbers until the next run.

      # R is needed because the fitzRoy package, which reads the player data, is an R package.
      - name: Set up R
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Keep the installed R packages between runs so they are not downloaded every time.
      - name: Restore saved R packages
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Library
          key: r-packages-v1-${{ steps.year.outputs.year }}

      - name: Install fitzRoy
        continue-on-error: true
        run: Rscript -e 'if (!requireNamespace("fitzRoy", quietly = TRUE)) install.packages("fitzRoy")'

      # Keep the downloaded player data between runs. The script only downloads seasons it does not have, plus the current one.
      # To force a fresh download of everything, change v3 to v4 in the key below.
      - name: Restore saved player data
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: build/players.tsv
          key: players-v3-${{ steps.year.outputs.year }}

      - name: Download player data
        continue-on-error: true
        run: Rscript scripts/fetch-players.R

      # Train the v2 model and write site/data/v2.json (our predictions only; the raw player data is never published).
      - name: Build SirenSim v2
        continue-on-error: true
        run: node scripts/build-v2.mjs

      # Build the Fantasy tab's data: one game log per player (site/data/players.json).
      - name: Build Fantasy player data
        continue-on-error: true
        run: node scripts/build-players.mjs

      # Prepare GitHub Pages.
      - uses: actions/configure-pages@v5

      # Package the site/ folder (the website plus the fresh data files).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Publish the package. This step produces the live URL.
      - id: deployment
        uses: actions/deploy-pages@v4
